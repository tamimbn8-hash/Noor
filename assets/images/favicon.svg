<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <!-- خلفية داكنة للتبويب -->
  <rect width="32" height="32" rx="7" fill="#061a13"/>
  <rect x="0.5" y="0.5" width="31" height="31" rx="6.5" stroke="#d4af37" stroke-opacity="0.35"/>
  
  <!-- محراب إسلامي هندسي عالي التباين (Mihrab Gateway) -->
  <path d="M 7 28 L 7 15 C 7 10, 11 5.5, 16 3.5 C 21 5.5, 25 10, 25 15 L 25 28" 
        stroke="#d4af37" 
        stroke-width="1.6" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
  
  <!-- الزخرفة الهندسية الإسلامية الثمانية (النور في قمة المحراب) -->
  <g transform="translate(16, 12)">
    <rect x="-3.5" y="-3.5" width="7" height="7" rx="0.8" fill="#08251c" stroke="#d4af37" stroke-width="1.1"/>
    <rect x="-3.5" y="-3.5" width="7" height="7" rx="0.8" transform="rotate(45)" fill="#08251c" stroke="#d4af37" stroke-width="1.1"/>
    <circle cx="0" cy="0" r="1.1" fill="#ffffff"/>
  </g>

  <!-- المصحف المفتوح في قاعدة المحراب -->
  <path d="M 16 25 C 11 23.5, 8 24.5, 5 26 C 6 21, 9 19, 16 20.5 Z" fill="#ffffff"/>
  <path d="M 16 25 C 21 23.5, 24 24.5, 27 26 C 26 21, 23 19, 16 20.5 Z" fill="#eef2f6"/>
  <line x1="16" y1="20.5" x2="16" y2="25.2" stroke="#10b981" stroke-width="1.2"/>
  <path d="M 5.8 25.6 C 9 24.4, 12.5 24.6, 15.6 25" stroke="#d4af37" stroke-width="0.8"/>
  <path d="M 26.2 25.6 C 23 24.4, 19.5 24.6, 16.4 25" stroke="#d4af37" stroke-width="0.8"/>
</svg>
