<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="44" height="44" fill="none">
  <!-- خلفية داكنة راقية (Deep Emerald / Dark Luxury Glass) -->
  <rect width="48" height="48" rx="12" fill="#061a13" stroke="rgba(212, 175, 55, 0.3)" stroke-width="1.2"/>
  
  <!-- 1. محراب إسلامي هندسي مينيمل (The Mihrab / Gateway of Light) -->
  <!-- القوس الإسلامي المدبب الفاخر (Pointed Islamic Arch) -->
  <path d="M 12 40 L 12 21 C 12 14, 18 8, 24 5 C 30 8, 36 14, 36 21 L 36 40" 
        stroke="#d4af37" 
        stroke-width="1.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        opacity="0.85" />
  
  <!-- إطار المحراب الداخلي الرقيق لتجسيد العمق المعماري -->
  <path d="M 15 40 L 15 22 C 15 16.5, 19.5 11.5, 24 9 C 28.5 11.5, 33 16.5, 33 22 L 33 40" 
        stroke="rgba(212, 175, 55, 0.35)" 
        stroke-width="0.9" 
        stroke-linecap="round" />

  <!-- 2. أشعة النور الصاعدة من المصحف الشريف نحو قمة المحراب -->
  <line x1="24" y1="28" x2="24" y2="19" stroke="rgba(212, 175, 55, 0.6)" stroke-width="1" stroke-linecap="round" />
  <line x1="22" y1="29" x2="19" y2="21" stroke="rgba(212, 175, 55, 0.35)" stroke-width="0.8" stroke-linecap="round" />
  <line x1="26" y1="29" x2="29" y2="21" stroke="rgba(212, 175, 55, 0.35)" stroke-width="0.8" stroke-linecap="round" />

  <!-- 3. الزخرفة الهندسية الإسلامية الدقيقة المنبثقة من النور (Geometric Islamic Noor Motif) -->
  <!-- نجمة هندسية ثمانية الأضلاع متداخلة بدقة باللون الذهبي المطفي الراقي -->
  <g transform="translate(24, 16)">
    <!-- المربع الأول -->
    <rect x="-4.2" y="-4.2" width="8.4" height="8.4" rx="1" fill="#08251c" stroke="#d4af37" stroke-width="1" />
    <!-- المربع الثاني المستدير بزاوية 45 درجة -->
    <rect x="-4.2" y="-4.2" width="8.4" height="8.4" rx="1" transform="rotate(45)" fill="#08251c" stroke="#d4af37" stroke-width="1" />
    <!-- نقطة النور البيضاء النقية في المركز -->
    <circle cx="0" cy="0" r="1.3" fill="#ffffff" />
  </g>

  <!-- 4. المصحف الشريف المفتوح في قاعدة المحراب (Open Holy Quran) -->
  <!-- الصفحة اليسرى للمصحف -->
  <path d="M 24 35 C 18 33, 14 34.2, 10 36 C 11 30, 15 27.5, 24 29 Z" 
        fill="#f8fafc" 
        stroke="rgba(255, 255, 255, 0.3)" 
        stroke-width="0.5" />
  
  <!-- الصفحة اليمنى للمصحف -->
  <path d="M 24 35 C 30 33, 34 34.2, 38 36 C 37 30, 33 27.5, 24 29 Z" 
        fill="#eef2f6" 
        stroke="rgba(255, 255, 255, 0.3)" 
        stroke-width="0.5" />

  <!-- حافة الصفحات المذهبة المطَفية -->
  <path d="M 10.8 35.6 C 14.5 34.2, 19 34.4, 23.5 35" fill="none" stroke="#d4af37" stroke-width="0.8" stroke-linecap="round" />
  <path d="M 37.2 35.6 C 33.5 34.2, 29 34.4, 24.5 35" fill="none" stroke="#d4af37" stroke-width="0.8" stroke-linecap="round" />

  <!-- خط فاصل منتصف المصحف الشريف باللون الزمردي الهادئ -->
  <line x1="24" y1="29" x2="24" y2="35.5" stroke="#10b981" stroke-width="1.2" stroke-linecap="round" />
</svg>
