<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="38" height="38" fill="none">
  <!-- خلفية الحاوية الدائرية الفاخرة (Deep Emerald Dark Glass) -->
  <rect width="40" height="40" rx="10" fill="#081e17" stroke="rgba(212, 175, 55, 0.28)" stroke-width="1"/>
  
  <!-- الصفحتان المفتوحتان للمصحف الشريف (Open Quran Book) بتصميم مينيملي نقي -->
  <!-- الصفحة اليسرى -->
  <path d="M 20 26 C 14 24, 9 25.5, 6 27 C 7 19.5, 12 17, 20 18.5 Z" 
        fill="#f8fafc" 
        stroke="rgba(255, 255, 255, 0.2)" 
        stroke-width="0.6" />
  
  <!-- الصفحة اليمنى -->
  <path d="M 20 26 C 26 24, 31 25.5, 34 27 C 33 19.5, 28 17, 20 18.5 Z" 
        fill="#eef2f6" 
        stroke="rgba(255, 255, 255, 0.2)" 
        stroke-width="0.6" />

  <!-- عمود المصحف الفاصل باللون الزمردي الهادئ -->
  <path d="M 20 18.5 L 20 26.2" stroke="#10b981" stroke-width="1.3" stroke-linecap="round" />

  <!-- خط الحافة الذهبية لصفحات المصحف (Soft Gold Quran Gilt Edge) -->
  <path d="M 6.8 26.6 C 10.5 25.2, 15 25.4, 19.5 26" fill="none" stroke="#d4af37" stroke-width="0.9" stroke-linecap="round" />
  <path d="M 33.2 26.6 C 29.5 25.2, 25 25.4, 20.5 26" fill="none" stroke="#d4af37" stroke-width="0.9" stroke-linecap="round" />

  <!-- قبس النور - نجمة النور الرباعية المشعة بهدوء فوق المصحف الشريف -->
  <path d="M 20 6 L 21.3 10.7 L 25 12 L 21.3 13.3 L 20 18 L 18.7 13.3 L 15 12 L 18.7 10.7 Z" 
        fill="#e5b945" />
  <!-- بريق النور الأبيض في قلب النجمة -->
  <circle cx="20" cy="12" r="1.1" fill="#ffffff" />
</svg>
